services:
  # redis
  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      start_period: 5s
      timeout: 5s
      interval: 5s
      retries: 100
    networks:
      - netbox
    tmpfs:
      - /data

  netbox:
    ports:
      - "127.0.0.1::8080"
    build:
      context: ../../../../dev
      dockerfile: netbox.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: test
      REDIS_HOST: redis
      REDIS_CACHE_HOST: redis
      SECRET_KEY: isolated-integration-test-secret-key-at-least-fifty-characters
      API_TOKEN_PEPPER_1: isolated-integration-test-pepper-at-least-fifty-characters
      NETBOX_SUPERUSER_NAME: test-user
      NETBOX_SUPERUSER_EMAIL: test@example.com
      DJANGO_SUPERUSER_PASSWORD: test-password
      ALLOWED_HOSTS: "*"
      SKIP_SUPERUSER: "true"
    user: "netbox:root"
    entrypoint: ["/usr/bin/tini", "--", "bash", "/opt/netbox/test-entrypoint.sh"]
    command: ["/opt/netbox/launch-netbox.sh"]
    healthcheck:
      test: curl -f http://localhost:8080/login/ || exit 1
      start_period: 180s
      timeout: 5s
      interval: 15s
      retries: 100
    networks:
      - netbox
    volumes:
      - ../../../../dev/configuration/configuration.py:/etc/netbox/config/configuration.py:ro
      - ../../../../dev/configuration/plugins.py.example:/etc/netbox/config/plugins.py:ro
      - ../../../../dev/init-scripts:/opt/netbox/init-scripts:ro
      - ./netbox-entrypoint.sh:/opt/netbox/test-entrypoint.sh:ro
      - ../../../../dev/plugins/d3c:/test-plugins/d3c:ro
      - ../../../../dev/plugins/csaf:/test-plugins/csaf:ro
    tmpfs:
      - /opt/netbox-plugins:mode=1777

  # postgres
  postgres:
    image: docker.io/postgres:18-alpine
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 100
    networks:
      - netbox
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql

networks:
  netbox: {}
